name: Go test job

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  go-test-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true 
          cache-dependency-path: |
            services/vulnerability-scanner/go.sum

      - name: Run API Gateway Tests
        working-directory: services/api-gateway
        run: go test -race -v ./...
      
      - name: Run API Gateway Vet Checks
        working-directory: services/api-gateway
        run: go vet ./...

      - name: Run Vulnerability Scanner Tests
        working-directory: services/vulnerability-scanner
        run: go test -race -v ./...
      
      - name: Run Vulnerability Scanner Vet Checks
        working-directory: services/vulnerability-scanner
        run: go vet ./...
    
  build-and-push:
    needs: go-test-job
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: checkout Code
      uses: actions/checkout@v4