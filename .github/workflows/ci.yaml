name: Go test job

# on:
#   push:
#     branches: [ main ]

permissions:
  contents: read

jobs:
  go-test-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true 
          cache-dependency-path: |
            services/api-gateway/go.sum
            services/vulnerability-scanner/go.sum


      - name: Install dependencies
        run: go mod download 